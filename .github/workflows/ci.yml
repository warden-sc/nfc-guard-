name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nfcguard
          POSTGRES_USER: nfcguard
          POSTGRES_PASSWORD: nfcguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nfcguard" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test (H2 + PostgreSQL)
        run: ./mvnw -B test
        env:
          NFCGUARD_TEST_PG_URL: jdbc:postgresql://localhost:5432/nfcguard
      - name: Docker image build
        run: docker build -t nfcguard-server .

  ml-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test (TensorFlow 없이 도는 파이프라인 테스트)
        run: |
          pip install numpy requests cryptography pytest
          python -m pytest -q tests

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + debug build + lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfcguard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
