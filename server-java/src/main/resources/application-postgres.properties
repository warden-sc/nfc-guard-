# PostgreSQL 프로필:  SPRING_PROFILES_ACTIVE=postgres  (또는 --spring.profiles.active=postgres)
# 접속 정보는 환경변수로 주입. 기본값은 server-java/docker-compose.yml 의 로컬 DB와 일치.
spring.datasource.url=${NFCGUARD_DB_URL:jdbc:postgresql://localhost:5432/nfcguard}
spring.datasource.username=${NFCGUARD_DB_USER:nfcguard}
spring.datasource.password=${NFCGUARD_DB_PASSWORD:nfcguard}

# 스키마: 개발 중에는 update로 자동 반영. 실서비스 전환 시 Flyway 마이그레이션 + validate 권장
spring.jpa.hibernate.ddl-auto=${NFCGUARD_DDL_AUTO:update}
spring.jpa.open-in-view=false
