spring.datasource.url=jdbc:h2:file:./data/nfcguard
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
nfcguard.model.dir=./models
server.port=8080

# 데이터셋 export(원본 센서 시계열 전체)용 관리자 키. 비어 있으면 export는 항상 401.
# 실배포 시 환경변수 NFCGUARD_ADMIN_API_KEY 로 주입.
nfcguard.admin.api-key=${NFCGUARD_ADMIN_API_KEY:}
nfcguard.rate-limit.per-device-per-hour=120
