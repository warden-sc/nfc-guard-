spring.datasource.url=jdbc:h2:file:./data/nfcguard
# 스키마는 Flyway(db/migration/{vendor})가 만들고 Hibernate는 엔티티와 일치하는지 검증만 한다.
# (예전 ddl-auto=update 로 만든 개발용 ./data DB가 있으면 삭제 후 실행)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
nfcguard.model.dir=./models
server.port=8080

# 데이터셋 export(원본 센서 시계열 전체)용 관리자 키. 비어 있으면 export는 항상 401.
# 실배포 시 환경변수 NFCGUARD_ADMIN_API_KEY 로 주입.
nfcguard.admin.api-key=${NFCGUARD_ADMIN_API_KEY:}
nfcguard.rate-limit.per-device-per-hour=120

# 개인정보 보유 기간: 수신 후 이 일수가 지난 이벤트는 매일 자동 삭제 (개인정보처리방침과 일치시킬 것)
nfcguard.retention.days=365

# Play Integrity 기기 검증: off(개발) / google(운영, GOOGLE_APPLICATION_CREDENTIALS 필요)
nfcguard.integrity.mode=${NFCGUARD_INTEGRITY_MODE:off}
nfcguard.integrity.package-name=com.nfcguard.app
nfcguard.integrity.nonce-secret=${NFCGUARD_NONCE_SECRET:}
